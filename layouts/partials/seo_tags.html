{{- if eq .Kind "404" }}
<meta name="robots" content="noindex">
{{- else }}
{{- $description := .Description | default (cond .IsPage (.Summary | plainify | truncate 160) site.Params.description) -}}
{{- $card := partial "social-card.html" . -}}
{{- $title := .Title | default site.Title -}}
<meta name="description" content="{{ $description }}">
<link rel="canonical" href="{{ .Permalink }}">
<meta property="og:site_name" content="{{ site.Title }}">
<meta property="og:title" content="{{ $title }}">
<meta property="og:description" content="{{ $description }}">
<meta property="og:type" content="{{ cond .IsPage "article" "website" }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:locale" content="{{ replace site.Language.LanguageCode "-" "_" }}">
<meta property="og:image" content="{{ $card.Permalink }}">
<meta property="og:image:width" content="{{ $card.Width }}">
<meta property="og:image:height" content="{{ $card.Height }}">
{{- if .IsPage }}
<meta property="article:published_time" content="{{ .PublishDate.Format "2006-01-02T15:04:05-07:00" }}">
<meta property="article:modified_time" content="{{ .Lastmod.Format "2006-01-02T15:04:05-07:00" }}">
{{- end }}
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ $title }}">
<meta name="twitter:description" content="{{ $description }}">
<meta name="twitter:image" content="{{ $card.Permalink }}">
{{- end }}
