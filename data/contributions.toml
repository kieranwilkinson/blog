# Contributions page (/contributions/).
#
# Each categories block below is a labelled section; one with no items is
# hidden. Items appear in the order listed (top of the list = top of the page).
#
# Category fields:
#   name    (required)  section label
#   shape   (optional)  "poster" (2:3, default) or "landscape" (16:9, for video)
#
# Item fields:
#   title   (required)  production name, shown under the tile
#   year    (optional)  for your reference; not shown
#   image   (optional)  poster/thumbnail URL, downloaded and resized at build
#                       time so the site keeps working if the source moves.
#                       Or a path under assets/ (e.g. "contributions/foo.jpg") for
#                       images whose links expire (LinkedIn, Google thumbnails).
#                       Leave out for a YouTube video to use its thumbnail.
#                       With no image at all, the tile shows a placeholder.
#   link    (optional)  where the tile goes when clicked, e.g. the IMDb page
#   video   (optional)  YouTube or Vimeo URL; the tile links to it (when there
#                       is no link) and shows a play badge
#   anchor  (optional)  which part of the image to keep when it's trimmed to
#                       fit the tile: "top", "bottom", "left", "right" (default
#                       centre)

